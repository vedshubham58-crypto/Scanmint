name: Build app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build the test APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: scanmint-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A fixed download link that's easy to open on a phone:
      # https://github.com/<owner>/<repo>/releases/download/test-build/scanmint-test.apk
      - name: Publish test APK as a download link
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk scanmint-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build scanmint-test.apk --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build (latest)" \
            --notes "Test version (Google test ads only). Built from ${GITHUB_SHA::7}."
