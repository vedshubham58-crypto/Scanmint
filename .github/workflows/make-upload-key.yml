name: Make upload key (run once)

# Run this ONCE, after adding the SIGNING_PASSWORD secret.
# It makes the key that signs ScanMint for Google Play, locks it with that password,
# and saves the locked file in the repo (signing/upload-key.p12.enc).
# Without the password the file is useless, so it's safe in a public repo.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make and lock the key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_PASSWORD secret first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ ${#SIGNING_PASSWORD} -lt 16 ]; then
            echo "::error::SIGNING_PASSWORD must be at least 16 characters. Make it longer and run again."
            exit 1
          fi
          if [ -f signing/upload-key.p12.enc ]; then
            echo "::error::An upload key already exists. Never replace it: Google Play only accepts updates signed with it."
            exit 1
          fi
          mkdir -p signing
          keytool -genkeypair -alias upload -keyalg RSA -keysize 4096 -validity 10000 \
            -storetype PKCS12 -keystore "$RUNNER_TEMP/upload.p12" \
            -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD \
            -dname "CN=ScanMint, O=vedshubham, C=IN"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$RUNNER_TEMP/upload.p12" -out signing/upload-key.p12.enc -pass env:SIGNING_PASSWORD
          echo "Upload key fingerprint (safe to share):"
          keytool -list -v -keystore "$RUNNER_TEMP/upload.p12" -storepass:env SIGNING_PASSWORD | grep -E "SHA256:"
          rm -f "$RUNNER_TEMP/upload.p12"

      - name: Save the locked key in the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/upload-key.p12.enc
          git commit -m "Add locked Google Play upload key"
          git push
